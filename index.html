<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the
         layout viewport (and 100dvh) instead of overlaying it, so full-height
         flex screens (chat) keep their composer above the keyboard and the page
         no longer scrolls up on input focus. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#110c1d" />
    <title>Ovoid</title>

    <!-- Warm the sockets the first paint depends on, in parallel with JS parse.
         crossorigin on the AppView (XRPC goes over CORS fetch — only a CORS
         connection is reusable for it); none on the image CDN (plain <img>). -->
    <link rel="preconnect" href="https://public.api.bsky.app" crossorigin />
    <link rel="preconnect" href="https://cdn.bsky.app" />
    <link rel="dns-prefetch" href="https://video.bsky.app" />
    <link rel="dns-prefetch" href="https://bsky.social" />

    <!-- PWA / add-to-home-screen -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Ovoid" />
    <script>
      // Set data-theme + the matching theme-color before first paint, so there's
      // no flash of the wrong theme and the Android system bars (which follow
      // theme-color) match the active theme from the start. Colors mirror --bg in
      // tokens.css (CSS vars aren't parsed yet here, so they're inlined).
      (function () {
        var BG = { light: '#ffffff', dim: '#110c1d', dark: '#030206' }
        var t = 'dim'
        try {
          t = localStorage.getItem('ovoid:theme') || 'dim'
        } catch (_) {}
        document.documentElement.setAttribute('data-theme', t)
        var m = document.querySelector('meta[name="theme-color"]')
        if (m && BG[t]) m.setAttribute('content', BG[t])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
