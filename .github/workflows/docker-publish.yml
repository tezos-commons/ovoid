name: Publish Docker image

# Build the production image and push it to the GitHub Container Registry.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr.io/tezos-commons/ovoid — github.repository is already lowercase here.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # required to push to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Production OAuth values are inlined at build time (see Dockerfile).
          # Set these as repository Variables (Settings → Secrets and variables →
          # Actions → Variables); empty is fine for a loopback/dev image.
          build-args: |
            VITE_CLIENT_ID=${{ vars.VITE_CLIENT_ID }}
            VITE_REDIRECT_URI=${{ vars.VITE_REDIRECT_URI }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
