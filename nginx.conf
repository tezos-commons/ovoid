server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets on the fly.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # OAuth client metadata must be served fresh (it IS the client_id URL).
    location = /client-metadata.json {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA: rewrite unknown paths to index.html so deep links / the OAuth callback
    # (e.g. /profile/alice/post/abc, /oauth/callback) resolve client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry document, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
